name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" ruff
      - name: Lint
        run: ruff check src tests examples
      - name: Test
        run: pytest -q
      - name: Smoke test the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          lookahead-guard --version
          lookahead-guard demo
          lookahead-guard cutoffs gpt-4o-2024-08-06
      - name: Examples
        run: |
          python examples/ab_demo.py
          # The example prompt is leaky on purpose: expect exit code 1.
          set +e
          lookahead-guard check examples/prompt.txt --as-of 2023-03-01 --model gpt-4o --format github
          test $? -eq 1
